name: Export iOS 18.5 SDKs

on: workflow_dispatch

permissions:
  contents: read

jobs:
  export-sdks:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      # 固定 SDK 来源，避免 runner 默认 Xcode 版本变化。
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      COPYFILE_DISABLE: "1"
    steps:
      - name: Pack device and simulator SDKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-sdks"
          xcodebuild -version | tee "$RUNNER_TEMP/ios-sdks/sdk-info.txt"

          for platform in iphoneos iphonesimulator; do
            sdk_path="$(xcrun --sdk "$platform" --show-sdk-path)"
            # 解析 SDK 目录自身的链接，保留目录内部的符号链接。
            sdk_path="$(cd "$sdk_path" && pwd -P)"
            sdk_name="$(basename "$sdk_path")"
            sdk_version="$(xcrun --sdk "$platform" --show-sdk-version)"
            printf '%s: %s\n' "$sdk_name" "$sdk_version" \
              | tee -a "$RUNNER_TEMP/ios-sdks/sdk-info.txt"
            tar -czf "$RUNNER_TEMP/ios-sdks/$sdk_name.tar.gz" \
              -C "$(dirname "$sdk_path")" "$sdk_name"
          done

          cd "$RUNNER_TEMP/ios-sdks"
          shasum -a 256 *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: ios-sdks-18.5
          path: ${{ runner.temp }}/ios-sdks
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
